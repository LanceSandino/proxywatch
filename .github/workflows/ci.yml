name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly run reports vulnerabilities published since the last push.
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal)"

      - name: Vet
        run: make vet

      - name: Build
        run: make build

      - name: Test with the race detector
        run: go test -race ./...

      - name: Vulnerability scan
        run: make vulncheck

      - name: Build container
        run: docker build --tag proxywatch:ci .

      - name: Run container doctor
        run: docker run --rm proxywatch:ci doctor
